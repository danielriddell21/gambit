version: 2

project_name: gambit

before:
  hooks:
    - go mod tidy

builds:
  # Headless CLI: CGO-free, cross-compiled to every desktop OS/arch. This is the
  # default build (Ebiten is behind the `ebiten` tag), so no display libs needed.
  - id: headless
    main: ./cmd/gambit
    binary: gambit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # GUI build: the Ebiten window compiled in via the `ebiten` tag. Needs cgo
  # (Metal / Cocoa), so it is macOS-only and built natively on the macOS runner.
  - id: gui
    main: ./cmd/gambit
    binary: gambit-gui
    env:
      - CGO_ENABLED=1
    flags:
      - -tags=ebiten
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: headless
    ids: [headless]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: gui
    ids: [gui]
    name_template: "{{ .ProjectName }}-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  name_template: "v{{ .Version }}"

# Homebrew formula: the cross-platform headless CLI (macOS + Linux + Windows).
brews:
  - name: gambit
    ids: [headless]
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/danielriddell21/gambit
    description: "Two chess agents play each other, logged in algebraic notation"
    license: MIT
    commit_msg_template: "Brew formula update for gambit {{ .Tag }}"
    install: |
      bin.install "gambit"
    test: |
      system "#{bin}/gambit", "--version"

# Homebrew cask: the macOS-only native Ebiten window.
homebrew_casks:
  - name: gambit
    ids: [gui]
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/danielriddell21/gambit
    description: "Watch two chess agents play in a native macOS window"
    license: MIT
    caveats: "The gambit board opens an Ebiten window and is macOS-only; on Linux/Windows install the formula and run in the terminal."
