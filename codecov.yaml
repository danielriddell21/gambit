coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

ignore:
  - "cmd/"
  - "internal/ui/"
  - "tests/"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
